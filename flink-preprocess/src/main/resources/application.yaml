# ============================================================
# Cấu hình nghiệp vụ và runtime cho flink-preprocess.
#
# Không ghi password, token hoặc secret vào file này.
# Environment override sẽ được triển khai trong JobConfig.
# ============================================================

job:
  # Tên xuất hiện trên Flink Web UI.
  name: flink-preprocess-v1

  # Có ba Kafka partition nên đặt source parallelism bằng 3.
  parallelism: 3

  # Tạo checkpoint mỗi 60 giây.
  checkpoint-interval-ms: 60000

  # Hủy checkpoint nếu chưa hoàn thành sau 5 phút.
  checkpoint-timeout-ms: 300000

  # Không cho hai checkpoint chạy đồng thời.
  max-concurrent-checkpoints: 1

  # Chờ tối thiểu 30 giây giữa hai checkpoint hoàn thành.
  min-pause-between-checkpoints-ms: 30000

kafka:
  # Địa chỉ Kafka broker mà Flink sẽ kết nối tới.
  # kafka:29092 thường là địa chỉ Kafka bên trong Docker network.
  bootstrap-servers: kafka:29092

  # Khi consumer group chưa có committed offset,
  # Flink sẽ đọc từ message cũ nhất còn được Kafka lưu.
  starting-offsets: earliest


bronze:
  # Topic chứa log thô do log-producer gửi vào Kafka.
  input-topic: raw.ue.log.line

  # Topic chứa dữ liệu đã được Bronze job kiểm tra và chuẩn hóa cơ bản.
  output-topic: bronze.ue.event

  # Topic chứa các message lỗi không thể xử lý ở Bronze layer.
  # DLQ là viết tắt của Dead Letter Queue.
  dlq-topic: dlq.ue.log.line

  # Consumer group của Bronze Flink job.
  # Kafka dùng giá trị này để lưu offset đã đọc của job.
  consumer-group-id: flink-bronze-v1

  # Hai prefix phải khác nhau.
  # Không chạy hai Bronze job cùng lúc với cùng prefix.
  output-transactional-id-prefix: flink-bronze-output-v1-
  dlq-transactional-id-prefix: flink-bronze-dlq-v1-

  # Phiên bản schema của JSON envelope nhận từ raw input topic.
  # Dùng để kiểm tra message đầu vào có đúng cấu trúc mong đợi không.
  envelope-schema-version: raw-envelope-v1

  # Phiên bản schema của dữ liệu Bronze được ghi ra output topic.
  output-schema-version: bronze-v1

  raw-log:
    # Ký tự dùng để phân tách các trường trong một dòng raw log.
    delimiter: ";"

    # Số lượng trường bắt buộc phải có sau khi tách raw log.
    # Nếu số field khác 52, message có thể bị xem là không hợp lệ.
    field-count: 52

  timestamp:
    # Múi giờ dùng để chuyển timestamp dạng local time
    # thành thời gian chuẩn khi xử lý dữ liệu.
    local-timezone: Asia/Ho_Chi_Minh


silver:
  # Tên hiển thị của Silver Job trên Flink Web UI.
  job-name: flink-silver-v1

  # Topic đầu vào của Silver job.
  # Dữ liệu được lấy từ output của Bronze job.
  input-topic: bronze.ue.event

  # Topic chứa dữ liệu Silver đã được làm sạch,
  # chuẩn hóa identity và bổ sung thông tin cần thiết.
  output-topic: silver.ue.event

  # Topic chứa các event không xác định được identity hợp lệ,
  # ví dụ thiếu hoặc sai IMSI, MSISDN, IMEI hoặc khóa định danh.
  invalid-identity-topic: invalid-identity

  # Topic chứa các loại event mà Silver job chưa hỗ trợ xử lý.
  unsupported-event-topic: unsupported-event

  # Topic chứa các event đến quá trễ so với watermark cho phép.
  late-event-topic: late-ue-event

  # Consumer group của Silver Flink job.
  # Group này phải khác consumer group của Bronze và Gold.
  consumer-group-id: flink-silver-v1

  # Mỗi Kafka sink EXACTLY_ONCE phải có transactional ID prefix riêng.
  output-transactional-id-prefix: flink-silver-output-v1-
  invalid-identity-transactional-id-prefix: flink-silver-invalid-identity-v1-
  unsupported-event-transactional-id-prefix: flink-silver-unsupported-event-v1-
  late-event-transactional-id-prefix: flink-silver-late-event-v1-

  # Phiên bản schema của dữ liệu Silver được ghi ra Kafka.
  output-schema-version: silver-v1

  # Cho phép event đến trễ tối đa 30.000 ms, tức 30 giây.
  # Flink dùng giá trị này để tạo watermark cho event time.
  watermark-max-out-of-orderness-ms: 30000

  # Nếu một Kafka partition không có dữ liệu trong 60 giây,
  # tạm coi partition đó là idle để nó không chặn watermark chung.
  watermark-idleness-ms: 60000

  # Thời gian tồn tại tối đa của dữ liệu trong Flink state.
  # 86.400.000 ms tương đương 24 giờ.
  # State không được sử dụng quá thời gian này có thể bị xóa.
  state-ttl-ms: 86400000

    # IDENTITY REFERENCE DATA DÙNG CHO LOCAL DEVELOPMENT
  # ==========================================================
  #
  # Nếu BronzeEvent có IMSI hợp lệ, Silver dùng IMSI trực tiếp
  # và không cần tra hai map dưới.
  #
  # Event không có IMSI mới fallback lần lượt:
  # MSISDN → IMSI
  # MTMSI  → IMSI
  identity-mappings:
    msisdn-to-imsi: {}
    mtmsi-to-imsi: {}

  # ==========================================================
  # EVENT CATALOG ĐƯỢC MODEL HỖ TRỢ
  # ==========================================================
  #
  # Chỉ EVENT_ID nằm trong danh sách này mới được đưa vào
  # silver.ue.event. Event khác đi vào unsupported-event.
  #
  # Không tự động coi mọi EVENT_ID raw là hợp lệ vì Gold và model
  # cần một vocabulary ổn định.
  supported-events:
    - alias: l_attach
      canonical-event-id: l_attach
      display-name: LTE Attach

    - alias: l_bearer_modify
      canonical-event-id: l_bearer_modify
      display-name: LTE Bearer Modify

    - alias: l_dedicated_bearer_activate
      canonical-event-id: l_dedicated_bearer_activate
      display-name: LTE Dedicated Bearer Activate

    - alias: l_dedicated_bearer_deactivate
      canonical-event-id: l_dedicated_bearer_deactivate
      display-name: LTE Dedicated Bearer Deactivate

    - alias: l_detach
      canonical-event-id: l_detach
      display-name: LTE Detach

    - alias: l_handover
      canonical-event-id: l_handover
      display-name: LTE Handover

    - alias: l_pdn_connect
      canonical-event-id: l_pdn_connect
      display-name: LTE PDN Connect

    - alias: l_service_request
      canonical-event-id: l_service_request
      display-name: LTE Service Request

    - alias: l_tau
      canonical-event-id: l_tau
      display-name: LTE Tracking Area Update


gold:
  # Topic đầu vào của Gold job.
  # Dữ liệu được lấy từ output của Silver job.
  input-topic: silver.ue.event

  # Phiên bản feature contract dùng để encode tensor gold.
  feature-version: gold-ue-sequence-feature-v1

  # Topic chứa các chuỗi sự kiện UE đã được tạo để phục vụ
  # phân tích, machine learning hoặc downstream processing.
  output-topic: gold.ue.sequence

  # Consumer group của Gold Flink job.
  consumer-group-id: flink-gold-v1

  # Phiên bản schema của dữ liệu sequence được ghi ra Gold topic.
  output-schema-version: gold-sequence-v1

  # Số lượng event tối đa trong một sequence.
  # Mỗi sequence sẽ chứa 32 event liên tiếp.
  sequence-length: 32

  # Số event dịch chuyển khi tạo sequence tiếp theo.
  # Ví dụ sequence đầu dùng event 1-32,
  # sequence tiếp theo dùng event 9-40.
  sequence-stride: 8

  # Gold phải tạo lại watermark vì watermark không được Kafka
  # truyền từ Silver Job sang Gold Job.
  watermark-max-out-of-orderness-ms: 30000
  watermark-idleness-ms: 60000

  # State theo UE tồn tại tối đa một ngày không được cập nhật.
  state-ttl-ms: 86400000
feature-contract:
  feature-version: gold-ue-sequence-feature-v1

  sequence:
    length: 32
    stride: 8
    padding-side: LEFT

    # Chỉ phát sample khi đã đủ 32 event.
    # Do đó tensor thực tế không chứa timestep padding.
    emit-partial-windows: false

  categorical:
    dtype: INT64
    feature-count: 4

    normalization:
      trim: true
      lowercase: true

    ordering: LEXICOGRAPHIC_ASCENDING

    # Không dùng padding-id, unknown-id hoặc missing-id vì các ID
    # 0, 1, 2... đang được category thật sử dụng.
    unknown-policy: REJECT
    missing-policy: REJECT

    features:
      - index: 0
        name: event_code
        source: eventId
        transform: fixed_vocabulary_lookup
        vocabulary:
          l_attach: 1
          l_bearer_modify: 2
          l_dedicated_bearer_activate: 3
          l_dedicated_bearer_deactivate: 4
          l_detach: 5
          l_handover: 6
          l_pdn_connect: 7
          l_service_request: 8
          l_tau: 9

      - index: 1
        name: event_result_code
        source: eventResult
        transform: fixed_vocabulary_lookup
        vocabulary:
          reject: 0
          success: 1

      - index: 2
        name: normalized_cause_code
        source: rawFields.CAUSE_CODE
        transform: fixed_vocabulary_lookup

        # Chuỗi rỗng là category hợp lệ, không phải missing.
        vocabulary:
          "": 0
          "10": 1
          "38": 2
          "9": 3

      - index: 3
        name: sub_cause_code
        source: rawFields.SUB_CAUSE_CODE
        transform: fixed_vocabulary_lookup

        # Chuỗi rỗng là category hợp lệ, không phải missing.
        vocabulary:
          "": 0
          "107": 1
          "11": 2
          "14": 3
          "403": 4
          "410": 5
          "413": 6

  numeric:
    dtype: FLOAT32
    feature-count: 2

    missing-value: -1.0
    normalized-valid-range:
      min: 0.0
      max: 1.0

    features:
      - index: 0
        name: duration_ms
        source: durationMs
        raw-clip-min: 0
        raw-clip-max: 600000
        transform: log1p_minmax

      - index: 1
        name: request_retries
        source: requestRetries
        raw-clip-min: 0
        raw-clip-max: 10
        transform: clipped_minmax
