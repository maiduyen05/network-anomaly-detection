# ============================================================
# Cấu hình nghiệp vụ và runtime cho flink-preprocess.
#
# Không ghi password, token hoặc secret vào file này.
# Environment override sẽ được triển khai trong JobConfig.
# ============================================================

job:
  # Có ba Kafka partition nên đặt source parallelism bằng 3.
  parallelism: 3

  # Tạo checkpoint mỗi 60 giây.
  checkpoint-interval-ms: 60000

  # Hủy checkpoint nếu chưa hoàn thành sau 5 phút.
  checkpoint-timeout-ms: 300000

  # Không cho hai checkpoint chạy đồng thời.
  max-concurrent-checkpoints: 1

  # Chờ tối thiểu 30 giây giữa hai checkpoint hoàn thành.
  min-pause-between-checkpoints-ms: 30000


kafka:
  # Địa chỉ Kafka broker mà Flink sẽ kết nối tới.
  # kafka:29092 là địa chỉ Kafka bên trong Docker network.
  bootstrap-servers: kafka:29092

  # Khi consumer group chưa có committed offset,
  # Flink đọc từ message cũ nhất Kafka còn lưu.
  starting-offsets: earliest


# ============================================================
# BRONZE
# ============================================================

bronze:
  # Tên Bronze Job trên Flink Web UI.
  job-name: flink-bronze-v1
  
  # Topic chứa log thô do producer/NiFi gửi vào Kafka.
  input-topic: raw.ue.log.line

  # Topic chứa BronzeEvent.
  output-topic: bronze.ue.event

  # Dead Letter Queue của Bronze.
  dlq-topic: dlq.ue.log.line

  # Kafka consumer group riêng của Bronze.
  consumer-group-id: flink-bronze-v1

  # EXACTLY_ONCE transactional prefixes.
  output-transactional-id-prefix: flink-bronze-output-v1-
  dlq-transactional-id-prefix: flink-bronze-dlq-v1-

  # Schema của envelope đầu vào.
  envelope-schema-version: raw-envelope-v1

  # Schema của BronzeEvent.
  output-schema-version: bronze-v1

  raw-log:
    # Raw log sử dụng dấu ";" làm delimiter.
    delimiter: ";"

    # Raw log hiện tại phải có đúng 52 field.
    field-count: 52

  timestamp:
    # Timestamp trong raw log được hiểu theo timezone Việt Nam.
    local-timezone: Asia/Ho_Chi_Minh


# ============================================================
# SILVER
# ============================================================

silver:
  # Tên Silver Job trên Flink UI.
  job-name: flink-silver-v1

  # Input từ Bronze.
  input-topic: bronze.ue.event

  # Output Silver.
  output-topic: silver.ue.event

  # Side outputs.
  invalid-identity-topic: invalid-identity
  unsupported-event-topic: unsupported-event
  late-event-topic: late-ue-event

  # Consumer group riêng của Silver.
  consumer-group-id: flink-silver-v1

  # Mỗi EXACTLY_ONCE sink phải có transactional prefix riêng.
  output-transactional-id-prefix: flink-silver-output-v1-
  invalid-identity-transactional-id-prefix: flink-silver-invalid-identity-v1-
  unsupported-event-transactional-id-prefix: flink-silver-unsupported-event-v1-
  late-event-transactional-id-prefix: flink-silver-late-event-v1-

  # Schema output Silver.
  output-schema-version: silver-v1

  # Cho phép out-of-order tối đa 30 giây.
  watermark-max-out-of-orderness-ms: 30000

  # Partition im lặng 60 giây được đánh dấu idle.
  watermark-idleness-ms: 60000

  # State TTL 24 giờ.
  state-ttl-ms: 86400000

  # ==========================================================
  # IDENTITY REFERENCE DATA CHO LOCAL DEVELOPMENT
  # ==========================================================

  # Nếu event đã có IMSI thì Silver dùng IMSI trực tiếp.
  #
  # Nếu không có IMSI:
  #
  # MSISDN -> IMSI
  # MTMSI  -> IMSI
  identity-mappings:
    msisdn-to-imsi: {}
    mtmsi-to-imsi: {}


  # ==========================================================
  # EVENT CATALOG ĐƯỢC MODEL HỖ TRỢ
  # ==========================================================

  supported-events:

    - alias: l_attach
      canonical-event-id: l_attach
      display-name: LTE Attach

    - alias: l_bearer_modify
      canonical-event-id: l_bearer_modify
      display-name: LTE Bearer Modify

    - alias: l_dedicated_bearer_activate
      canonical-event-id: l_dedicated_bearer_activate
      display-name: LTE Dedicated Bearer Activate

    - alias: l_dedicated_bearer_deactivate
      canonical-event-id: l_dedicated_bearer_deactivate
      display-name: LTE Dedicated Bearer Deactivate

    - alias: l_detach
      canonical-event-id: l_detach
      display-name: LTE Detach

    - alias: l_handover
      canonical-event-id: l_handover
      display-name: LTE Handover

    - alias: l_pdn_connect
      canonical-event-id: l_pdn_connect
      display-name: LTE PDN Connect

    - alias: l_pdn_disconnect
      canonical-event-id: l_pdn_disconnect
      display-name: LTE PDN Disconnect

    - alias: l_service_request
      canonical-event-id: l_service_request
      display-name: LTE Service Request

    - alias: l_tau
      canonical-event-id: l_tau
      display-name: LTE Tracking Area Update


# ============================================================
# GOLD
# ============================================================

gold:
  # Tên Gold Job trên Flink UI.
  job-name: flink-gold-v1

  # Gold đọc SilverEvent.
  input-topic: silver.ue.event

  # Output model-ready.
  #
  # Bao gồm:
  #
  # x_cat[32][4]
  # x_num[32][2]
  # metadata window
  # evidence
  output-topic: gold.ue.sequence

  # Event đến quá trễ.
  too-late-event-topic: gold-too-late-event

  # Window không encode được theo feature contract.
  invalid-feature-topic: invalid-gold-feature

  # Consumer group riêng của Gold.
  consumer-group-id: flink-gold-v1


  # ==========================================================
  # EXACTLY-ONCE TRANSACTION PREFIX
  # ==========================================================

  output-transactional-id-prefix: flink-gold-output-v1-

  too-late-event-transactional-id-prefix: flink-gold-too-late-v1-

  invalid-feature-transactional-id-prefix: flink-gold-invalid-feature-v1-


  # ==========================================================
  # OUTPUT SCHEMA
  # ==========================================================

  # GoldSequenceSample schema.
  output-schema-version: gold-sequence-v1

  # InvalidGoldFeatureRecord schema.
  invalid-feature-schema-version: invalid-gold-feature-v1


  # ==========================================================
  # EVENT TIME
  # ==========================================================

  # Gold phải tạo watermark mới vì Kafka
  # không lưu watermark của upstream Flink Job.
  watermark-max-out-of-orderness-ms: 30000

  # Partition không có dữ liệu 60 giây
  # được coi là idle.
  watermark-idleness-ms: 60000


  # ==========================================================
  # STATE
  # ==========================================================

  # State theo UE hết hạn sau 24 giờ
  # không được cập nhật.
  state-ttl-ms: 86400000


  # ==========================================================
  # CONFIGURABLE EVIDENCE
  # ==========================================================
  #
  # Các field ở đây phục vụ:
  #
  # - UI;
  # - audit;
  # - debug;
  # - điều tra anomaly;
  # - giải thích model.
  #
  # Có thể thêm hoặc bỏ field mà KHÔNG thay đổi:
  #
  # - sequence length;
  # - vocabulary;
  # - x_cat;
  # - x_num;
  # - model contract.
  #
  # Ví dụ muốn thêm APN:
  #
  #   - apn
  #
  # GoldEvidenceFieldProjector sẽ fallback sang:
  #
  # rawFields["APN"]
  #
  evidence:
    fields:

      # ------------------------------------------------------
      # Event
      # ------------------------------------------------------

      - event_id
      - event_name

      - event_result
      - event_result_label

      - duration_ms
      - event_time


      # ------------------------------------------------------
      # UE identity
      # ------------------------------------------------------

      - msisdn
      - imsi
      - mtmsi
      - imeisv


      # ------------------------------------------------------
      # Network identity
      # ------------------------------------------------------

      - mmegi
      - mmec


      # ------------------------------------------------------
      # Cause / signaling
      # ------------------------------------------------------

      - sub_cause_code
      - msc


      # ------------------------------------------------------
      # Location / serving network
      # ------------------------------------------------------

      - tac
      - eci
      - sgw
      - sgsn
      - pdn_pgw


# ============================================================
# GOLD MODEL FEATURE CONTRACT
# ============================================================
#
# Đây là source of truth duy nhất cho model input.
#
# Không được thay vocabulary/range/shape mà vẫn giữ
# feature-version hiện tại.
#
# Nếu thay đổi feature contract thì phải:
#
# 1. tạo feature-version mới;
# 2. train lại model tương ứng;
# 3. deploy model mới.
# ============================================================

feature-contract:
  feature-version: gold-ue-sequence-feature-v2


  # ==========================================================
  # SEQUENCE
  # ==========================================================

  sequence:
    length: 32
    stride: 8

    padding-side: LEFT

    emit-partial-windows: false


  # ==========================================================
  # CATEGORICAL FEATURES
  # ==========================================================

  categorical:
    dtype: INT64

    feature-count: 4

    normalization:
      trim: true
      lowercase: true

    ordering: LEXICOGRAPHIC_ASCENDING

    # Runtime không tự sinh ID mới.
    unknown-policy: REJECT

    # Missing EVENT_ID/EVENT_RESULT vẫn invalid.
    missing-policy: REJECT

    features:

      # ======================================================
      # x_cat[:, 0]
      # EVENT_ID
      #
      # 10 event observed trong dataset hiện tại.
      # Non-empty category được map 1..N theo thứ tự
      # lexicographic.
      # ======================================================

      - index: 0
        name: event_code
        source: eventId
        transform: fixed_vocabulary_lookup

        vocabulary:
          l_attach: 1
          l_bearer_modify: 2
          l_dedicated_bearer_activate: 3
          l_dedicated_bearer_deactivate: 4
          l_detach: 5
          l_handover: 6
          l_pdn_connect: 7
          l_pdn_disconnect: 8
          l_service_request: 9
          l_tau: 10


      # ======================================================
      # x_cat[:, 1]
      # EVENT_RESULT
      #
      # Dataset hiện tại:
      #
      # abort
      # reject
      # success
      #
      # 8 blank values không phải category.
      # ======================================================

      - index: 1
        name: event_result_code
        source: eventResult
        transform: fixed_vocabulary_lookup

        vocabulary:
          "": 0
          abort: 1
          reject: 2
          success: 3


      # ======================================================
      # x_cat[:, 2]
      # CAUSE_CODE
      #
      # Empty string là category thực sự trong source.
      #
      # "unspecified" cũng xuất hiện explicit trong dataset,
      # vì vậy giữ nguyên meaning thay vì map vào empty.
      # ======================================================

      - index: 2
        name: normalized_cause_code
        source: rawFields.CAUSE_CODE
        transform: fixed_vocabulary_lookup

        vocabulary:
          "": 0
          "0": 1
          "10": 2
          "11": 3
          "13": 4
          "15": 5
          "16": 6
          "17": 7
          "26": 8
          "3": 9
          "30": 10
          "31": 11
          "32": 12
          "34": 13
          "38": 14
          "39": 15
          "40": 16
          "43": 17
          "53": 18
          "6": 19
          "65": 20
          "7": 21
          "73": 22
          "87": 23
          "88": 24
          "9": 25
          unspecified: 26


      # ======================================================
      # x_cat[:, 3]
      # SUB_CAUSE_CODE
      #
      # 63 category observed trong dataset hiện tại.
      # Empty string = 0.
      # Non-empty category = 1..N lexicographic.
      # ======================================================

      - index: 3
        name: sub_cause_code
        source: rawFields.SUB_CAUSE_CODE
        transform: fixed_vocabulary_lookup

        vocabulary:
          "": 0
          "1": 1
          "102": 2
          "104": 3
          "107": 4
          "108": 5
          "109": 6
          "11": 7
          "12": 8
          "13": 9
          "14": 10
          "15": 11
          "16": 12
          "17": 13
          "2": 14
          "204": 15
          "3": 16
          "304": 17
          "306": 18
          "308": 19
          "311": 20
          "312": 21
          "315": 22
          "316": 23
          "317": 24
          "318": 25
          "403": 26
          "405": 27
          "410": 28
          "413": 29
          "419": 30
          "420": 31
          "422": 32
          "423": 33
          "424": 34
          "427": 35
          "428": 36
          "429": 37
          "430": 38
          "435": 39
          "440": 40
          "441": 41
          "5": 42
          "503": 43
          "504": 44
          "505": 45
          "506": 46
          "507": 47
          "509": 48
          "603": 49
          "605": 50
          "606": 51
          "607": 52
          "608": 53
          "610": 54
          "611": 55
          "7": 56
          "704": 57
          "706": 58
          "709": 59
          "710": 60
          "8": 61
          "9": 62


  # ==========================================================
  # NUMERIC FEATURES
  # ==========================================================

  numeric:
    dtype: FLOAT32

    feature-count: 2

    missing-value: -1.0

    normalized-valid-range:
      min: 0.0
      max: 1.0

    features:

      # ======================================================
      # x_num[:, 0]
      # DURATION
      # ======================================================

      - index: 0
        name: duration_ms
        source: durationMs

        raw-clip-min: 0
        raw-clip-max: 600000

        transform: log1p_minmax


      # ======================================================
      # x_num[:, 1]
      # REQUEST_RETRIES
      # ======================================================

      - index: 1
        name: request_retries
        source: requestRetries

        raw-clip-min: 0
        raw-clip-max: 10

        transform: clipped_minmax