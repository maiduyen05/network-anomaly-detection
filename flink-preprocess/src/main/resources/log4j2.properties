# ============================================================
# Ghi log ra console để Docker/Flink Web UI có thể thu thập.
# Không log raw_payload vì payload có thể chứa IMSI/MSISDN.
# ============================================================

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender

# Console appender.
appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout

# Hiển thị thời gian, level, thread, logger và message.
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] %logger{36} - %msg%n

# Giảm log chi tiết của Kafka client.
logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN

# Giữ thông tin lifecycle/checkpoint của Flink.
logger.flink.name = org.apache.flink
logger.flink.level = INFO

# Log của code dự án.
logger.preprocess.name = com.network.preprocess
logger.preprocess.level = INFO