# ============================================================
# Application configuration
# ============================================================

# Topic raw mà Java producer sẽ ghi message vào (topic đích)
app.topic=raw.ue.log.line


# ============================================================
# Kafka connection
# ============================================================

# Producer đang chạy trực tiếp trong WSL/host nên dùng localhost.
# Nếu producer được đóng thành container trong cùng Docker Compose,
# giá trị thường đổi thành kafka:9092.
bootstrap.servers=localhost:9092

# Tên producer giúp nhận diện producer trong log và metrics Kafka.
client.id=network-log-file-producer


# ============================================================
# Serialization
# ============================================================

# Kafka key và value đều là String (nên giờ cần chuyển sang dạng byte[] )
# Key: hash IMSI hoặc hash MSISDN, nếu không có thì là  rawRecordId.
# Value: JSON raw envelope.
# JSON string --> StringSerializer chuyển thành byte[] để Kafka gửi và lưu 
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer


# ============================================================
# Delivery reliability
# ============================================================

# Chờ Kafka xác nhận từ toàn bộ replica đang đồng bộ (= all là producer chỉ coi gửi thành công khi kafka xác nhận đã lưu theo mức an toàn cao nhất hiện có)
# Với máy local thì replication-factor=1, tức là broker leader cũng là replica duy nhất.
acks=all

# Giảm khả năng message bị ghi trùng khi Kafka client tự retry.
# Ví dụ khi broker bị lỗi, producer tưởng chưa gửi thành công và gửi lại. Dòng này giúp hạn chế message bị ghi trùng
enable.idempotence=true

# Kafka client tự gửi lại nhiều lần khi gặp lỗi tạm thời 
retries=2147483647

# Không retry khi gặp lỗi vô hạn thời gian, nên cần set timeout để tránh producer treo vô hạn.
# Đây là tổng thời gian cho toàn bộ quá trình gửi và retry 
delivery.timeout.ms=120000

# Trong một kết nối, producer có thể gửi tối đa 5 request chưa được phản hồi từ broker. Nếu vượt quá, producer sẽ block cho đến khi có phản hồi.
max.in.flight.requests.per.connection=5

# Thời gian chờ phản hồi tối đa của mỗi request, quá thời gian được coi là thất bại và có thể được retry 
request.timeout.ms=30000


# ============================================================
# Throughput and batching
# ============================================================

# Producer nén batch trước khi gửi kafka 
# Mục tiêu: 
# Giảm DL truyền qua mạng 
# Giảm dung lượng Kafka phải ghi 
# Tăng throughput của producer (vì giảm số request gửi đi)
# lz4 là thuật toán nén nhanh, hiệu quả tốt với dữ liệu log text.
compression.type=lz4    

# Kích thước batch tối đa khoảng 64 KiB cho mỗi partition.
# Kafka gom batch riêng cho từng partition
batch.size=65536    

# Chờ tối đa 10 ms để gom thêm message vào batch.
linger.ms=10

# Tổng bộ nhớ Kafka Producer dùng để giữ record chưa gửi xong.
# Java tạo message --> Message được đặt vào bộ nhớ đệm --> Gom thành batch --> Gửi sang kafka
buffer.memory=33554432